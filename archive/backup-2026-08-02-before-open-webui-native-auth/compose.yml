name: local-ai-appliance

services:
  redis:
    image: ${REDIS_IMAGE}
    container_name: ai-redis
    restart: unless-stopped
    volumes:
      - /mnt/ai-files/redis/data:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      OPENWEBUI_DB_USER: ${OPENWEBUI_DB_USER}
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI_DB_PASSWORD}
      OPENWEBUI_DB_NAME: ${OPENWEBUI_DB_NAME}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_DB_NAME: ${AUTHENTIK_DB_NAME}
    volumes:
      - /mnt/ai-files/postgres:/var/lib/postgresql
      - /mnt/ai-files/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /mnt/ai-files/ollama/data:/root/.ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    gpus: all
    environment:
      TZ: ${TZ}
      OLLAMA_KEEP_ALIVE: 1h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"

  speaches:
    image: ${SPEACHES_IMAGE}
    container_name: ai-speaches
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WHISPER__INFERENCE_DEVICE: cpu
      PRELOAD_MODELS: "Systran/faster-whisper-medium,speaches-ai/Kokoro-82M-v1.0-ONNX"
    volumes:
      - /mnt/ai-files/speaches/models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  authentik-server:
    image: ${AUTHENTIK_IMAGE}
    container_name: ai-authentik-server
    restart: unless-stopped
    command: server
    ports:
      - "192.168.1.63:9000:9000"
    environment:
      TZ: ${TZ}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
    volumes:
      - /mnt/ai-files/authentik/media:/media
      - /mnt/ai-files/authentik/templates:/templates
    networks:
      - proxy
      - database
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/-/health/ready/')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.authentik.rule=Host(`${AUTH_FQDN}`)
    #   - traefik.http.routers.authentik.entrypoints=websecure
    #   - traefik.http.routers.authentik.tls=true
    #   - traefik.http.routers.authentik.tls.certresolver=letsencrypt
    #   - traefik.http.services.authentik.loadbalancer.server.port=9000

  authentik-worker:
    image: ${AUTHENTIK_IMAGE}
    container_name: ai-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      TZ: ${TZ}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
    volumes:
      - /mnt/ai-files/authentik/media:/media
      - /mnt/ai-files/authentik/templates:/templates
      - /mnt/ai-files/authentik/certs:/certs
    networks:
      - proxy
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik-server:
        condition: service_healthy

  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    container_name: ai-open-webui
    restart: unless-stopped
    ports:
      - "192.168.1.63:8080:8080"
    environment:
      TZ: ${TZ}
      WEBUI_URL: https://${AI_FQDN}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://${OPENWEBUI_DB_USER}:${OPENWEBUI_DB_PASSWORD}@postgres:5432/${OPENWEBUI_DB_NAME}
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_SCOPES: openid email profile
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ADMIN_ROLES: ai-admins
      OAUTH_ALLOWED_ROLES: ai-admins,ai-users
      DEFAULT_MODELS: "gemma4:e4b-it-qat"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&language=en-AU&region=au-en"
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      UVICORN_WORKERS: "1"
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_STT_OPENAI_API_KEY: unused
      AUDIO_STT_MODEL: Systran/faster-whisper-medium
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_TTS_OPENAI_API_KEY: unused
      AUDIO_TTS_MODEL: speaches-ai/Kokoro-82M-v1.0-ONNX
      AUDIO_TTS_VOICE: af_bella
      COMFYUI_BASE_URL: http://comfyui:8188
    volumes:
      - /mnt/ai-files/open-webui/data:/app/backend/data
      - /mnt/ai-files/open-webui/knowledge:/knowledge:ro
    networks:
      - proxy
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      speaches:
        condition: service_healthy
      weather-server:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.openwebui.rule=Host(`${AI_FQDN}`)
    #   - traefik.http.routers.openwebui.entrypoints=websecure
    #   - traefik.http.routers.openwebui.tls=true
    #   - traefik.http.routers.openwebui.tls.certresolver=letsencrypt
    #   - traefik.http.services.openwebui.loadbalancer.server.port=8080

  # FUTURE: Add a self-hosted memory service here once a solution supports Ollama + PostgreSQL
  # out of the box. Options to revisit:
  #   - mem0 server (server/ dir) once it gains native Ollama support
  #   - A community fork of mem0 with Ollama provider
  #   - An alternative like Letta (formerly MemGPT)
  # In the meantime, Open WebUI's built-in memory feature covers basic needs.

  portainer:
    image: ${PORTAINER_IMAGE}
    container_name: ai-portainer
    restart: unless-stopped
    ports:
      - "192.168.1.63:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/ai-files/portainer/data:/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.portainer.rule=Host(`${PORTAINER_FQDN}`)
    #   - traefik.http.routers.portainer.entrypoints=websecure
    #   - traefik.http.routers.portainer.tls=true
    #   - traefik.http.routers.portainer.tls.certresolver=letsencrypt
    #   - traefik.http.services.portainer.loadbalancer.server.port=9000

  searxng:
    container_name: ai-searxng
    image: ${SEARXNG_IMAGE}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - proxy
      - backend
    volumes:
      - /mnt/ai-files/searxng/config:/etc/searxng:rw
      - /mnt/ai-files/searxng/cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.searxng.rule=Host(`${SEARXNG_FQDN}`)
    #   - traefik.http.routers.searxng.entrypoints=websecure
    #   - traefik.http.routers.searxng.tls=true
    #   - traefik.http.routers.searxng.tls.certresolver=letsencrypt
    #   - traefik.http.services.searxng.loadbalancer.server.port=8080
    #   - traefik.http.routers.searxng.middlewares=searxng-realip
    #   - traefik.http.middlewares.searxng-realip.forwardedheaders.trustedips=0.0.0.0/0

  weather-server:
    build:
      context: ./open-webui/weather
    container_name: ai-weather-server
    restart: unless-stopped
    ports:
      - "192.168.1.63:8000:8000"
    environment:
      TZ: ${TZ}
    volumes:
      - ${GEOIP_DB_PATH}:/geoip/GeoLite2-City.mmdb:ro
    expose:
      - "8000"
    networks:
      - proxy
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.weather.rule=Host(`${WEATHER_FQDN}`)
    #   - traefik.http.routers.weather.entrypoints=websecure
    #   - traefik.http.routers.weather.tls=true
    #   - traefik.http.routers.weather.tls.certresolver=letsencrypt
    #   - traefik.http.services.weather.loadbalancer.server.port=8000

  # ComfyUI — yanwk/comfyui-boot (community image, actively maintained)
  # https://hub.docker.com/r/yanwk/comfyui-boot/tags
  comfyui:
    image: ${COMFYUI_IMAGE}
    container_name: ai-comfyui
    restart: unless-stopped
    ports:
      - "192.168.1.63:8188:8188"
    environment:
      CLI_ARGS: ""
      # CLI_ARGS: "--lowvram"    # if VRAM is tight while Ollama is running
      # CLI_ARGS: "--gpu-only"   # force all processing onto GPU
      # CLI_ARGS: "--fast"       # experimental speed optimisations
    volumes:
      - /mnt/ai-files/comfyui/models:/root/ComfyUI/models
      - /mnt/ai-files/comfyui/output:/root/ComfyUI/output
      - /mnt/ai-files/comfyui/input:/root/ComfyUI/input
      - /mnt/ai-files/comfyui/custom_nodes:/root/ComfyUI/custom_nodes
      - /mnt/ai-files/comfyui/user:/root/ComfyUI/user
    networks:
      - proxy
      - backend
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.comfyui.rule=Host(`${COMFYUI_FQDN}`)
    #   - traefik.http.routers.comfyui.entrypoints=websecure
    #   - traefik.http.routers.comfyui.tls=true
    #   - traefik.http.routers.comfyui.tls.certresolver=letsencrypt
    #   - traefik.http.services.comfyui.loadbalancer.server.port=8188

networks:
  proxy:
    name: ai_proxy
  backend:
    name: ai_backend
  database:
    name: ai_database
    internal: true
