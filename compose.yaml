name: local-ai-appliance

services:

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ai-postgres
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      OPENWEBUI_DB_USER: ${OPENWEBUI_DB_USER}
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI_DB_PASSWORD}
      OPENWEBUI_DB_NAME: ${OPENWEBUI_DB_NAME}

    volumes:
      - ${AI_FILES_BASE}/postgres:/var/lib/postgresql
      - ${AI_FILES_BASE}/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ollama
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "11434"
    ports:
      - "${LLM_BIND_IP}:11434:11434"
    volumes:
      - ${AI_FILES_BASE}/ollama/data:/root/.ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    gpus: all
    environment:
      TZ: ${TZ}
      OLLAMA_KEEP_ALIVE: 1h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"

  speaches:
    image: ${SPEACHES_IMAGE}
    container_name: ai-speaches
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      WHISPER__INFERENCE_DEVICE: cpu
      PRELOAD_MODELS: "Systran/faster-whisper-medium,speaches-ai/Kokoro-82M-v1.0-ONNX"
    volumes:
      - ${AI_FILES_BASE}/speaches/models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s


  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    container_name: ai-open-webui
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LLM_BIND_IP}:8080:8080"
    environment:
      TZ: ${TZ}
      WEBUI_URL: https://${AI_FQDN}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://${OPENWEBUI_DB_USER}:${OPENWEBUI_DB_PASSWORD}@postgres:5432/${OPENWEBUI_DB_NAME}
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_SIGNUP: "true"
      ENABLE_LOGIN_FORM: "true"
      DEFAULT_USER_ROLE: user
      DEFAULT_MODELS: "gemma4:e4b-it-qat"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&language=en-AU&region=au-en"
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      UVICORN_WORKERS: "1"
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_STT_OPENAI_API_KEY: unused
      AUDIO_STT_MODEL: Systran/faster-whisper-medium
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_TTS_OPENAI_API_KEY: unused
      AUDIO_TTS_MODEL: speaches-ai/Kokoro-82M-v1.0-ONNX
      AUDIO_TTS_VOICE: af_bella
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "comfyui"
      IMAGE_SIZE: "1024x1024"
      IMAGE_STEPS: "28"
      COMFYUI_BASE_URL: http://comfyui:8188
      COMFYUI_WORKFLOW: '{"4":{"inputs":{"ckpt_name":"animagine-xl-4.0-opt.safetensors"},"class_type":"CheckpointLoaderSimple","_meta":{"title":"Load Checkpoint"}},"5":{"inputs":{"width":1024,"height":1024,"batch_size":1},"class_type":"EmptyLatentImage","_meta":{"title":"Empty Latent Image"}},"6":{"inputs":{"text":"masterpiece, high score, great score, absurdres, 1girl, solo, long black hair, blue eyes, modern casual clothing, standing in a bright modern kitchen, clean anime illustration, detailed eyes, clean lineart, soft shading, colorful lighting","clip":["4",1]},"class_type":"CLIPTextEncode","_meta":{"title":"CLIP Text Encode (Positive Prompt)"}},"7":{"inputs":{"text":"lowres, bad anatomy, bad hands, text, error, missing fingers, extra digits, fewer digits, cropped, worst quality, low quality, normal quality, blurry, signature, watermark, username","clip":["4",1]},"class_type":"CLIPTextEncode","_meta":{"title":"CLIP Text Encode (Negative Prompt)"}},"8":{"inputs":{"seed":173805153958730,"steps":28,"cfg":5,"sampler_name":"euler_ancestral","scheduler":"normal","denoise":1,"model":["4",0],"positive":["6",0],"negative":["7",0],"latent_image":["5",0]},"class_type":"KSampler","_meta":{"title":"KSampler"}},"9":{"inputs":{"samples":["8",0],"vae":["4",2]},"class_type":"VAEDecode","_meta":{"title":"VAE Decode"}},"10":{"inputs":{"filename_prefix":"animagine/anime","images":["9",0]},"class_type":"SaveImage","_meta":{"title":"Save Image"}}}'
    volumes:
      - ${AI_FILES_BASE}/open-webui/data:/app/backend/data
      - ${AI_FILES_BASE}/open-webui/knowledge:/knowledge:ro
      - ${AI_FILES_BASE}/open-webui/profiles:/app/profiles:ro
    networks:
      - proxy
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      speaches:
        condition: service_healthy
      weather-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.openwebui.rule=Host(`${AI_FQDN}`)
    #   - traefik.http.routers.openwebui.entrypoints=websecure
    #   - traefik.http.routers.openwebui.tls=true
    #   - traefik.http.routers.openwebui.tls.certresolver=letsencrypt
    #   - traefik.http.services.openwebui.loadbalancer.server.port=8080

  # FUTURE: Add a self-hosted memory service here once a solution supports Ollama + PostgreSQL
  # out of the box. Options to revisit:
  #   - mem0 server (server/ dir) once it gains native Ollama support
  #   - A community fork of mem0 with Ollama provider
  #   - An alternative like Letta (formerly MemGPT)
  # In the meantime, Open WebUI's built-in memory feature covers basic needs.

  searxng:
    container_name: ai-searxng
    image: ${SEARXNG_IMAGE}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LLM_BIND_IP}:8888:8080"
    environment:
      TZ: ${TZ}
    networks:
      - proxy
      - backend
    volumes:
      - ${AI_FILES_BASE}/searxng/config:/etc/searxng:rw
      - ${AI_FILES_BASE}/searxng/cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.searxng.rule=Host(`${SEARXNG_FQDN}`)
    #   - traefik.http.routers.searxng.entrypoints=websecure
    #   - traefik.http.routers.searxng.tls=true
    #   - traefik.http.routers.searxng.tls.certresolver=letsencrypt
    #   - traefik.http.services.searxng.loadbalancer.server.port=8080
    #   - traefik.http.routers.searxng.middlewares=searxng-realip
    #   - traefik.http.middlewares.searxng-realip.forwardedheaders.trustedips=0.0.0.0/0

  weather-server:
    build:
      context: ./open-webui/weather
    container_name: ai-weather-server
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LLM_BIND_IP}:8000:8000"
    environment:
      TZ: ${TZ}
    volumes:
      - ${GEOIP_DB_PATH}:/geoip/GeoLite2-City.mmdb:ro
    expose:
      - "8000"
    networks:
      - proxy
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.weather.rule=Host(`${WEATHER_FQDN}`)
    #   - traefik.http.routers.weather.entrypoints=websecure
    #   - traefik.http.routers.weather.tls=true
    #   - traefik.http.routers.weather.tls.certresolver=letsencrypt
    #   - traefik.http.services.weather.loadbalancer.server.port=8000

  # ComfyUI — yanwk/comfyui-boot (community image, actively maintained)
  # https://hub.docker.com/r/yanwk/comfyui-boot/tags
  comfyui:
    image: ${COMFYUI_IMAGE}
    container_name: ai-comfyui
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LLM_BIND_IP}:8188:8188"
    environment:
      CLI_ARGS: ""
      # CLI_ARGS: "--lowvram"    # if VRAM is tight while Ollama is running
      # CLI_ARGS: "--gpu-only"   # force all processing onto GPU
      # CLI_ARGS: "--fast"       # experimental speed optimisations
    volumes:
      - ${AI_FILES_BASE}/comfyui/models:/root/ComfyUI/models
      - ${AI_FILES_BASE}/comfyui/output:/root/ComfyUI/output
      - ${AI_FILES_BASE}/comfyui/input:/root/ComfyUI/input
      - ${AI_FILES_BASE}/comfyui/custom_nodes:/root/ComfyUI/custom_nodes
      - ${AI_FILES_BASE}/comfyui/user:/root/ComfyUI/user
      # Runs pre-start.sh on every boot to install custom-node Python deps in the
      # live interpreter (build-time install impossible: no python at build).
      - ${AI_FILES_BASE}/comfyui/user-scripts:/root/user-scripts
    networks:
      - proxy
      - backend
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=ai_proxy
    #   - traefik.http.routers.comfyui.rule=Host(`${COMFYUI_FQDN}`)
    #   - traefik.http.routers.comfyui.entrypoints=websecure
    #   - traefik.http.routers.comfyui.tls=true
    #   - traefik.http.routers.comfyui.tls.certresolver=letsencrypt
    #   - traefik.http.services.comfyui.loadbalancer.server.port=8188

networks:
  proxy:
    name: ai_proxy
  backend:
    name: ai_backend
  database:
    name: ai_database
    internal: true
