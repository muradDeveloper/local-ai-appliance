name: local-ai-appliance

services:
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: ai-traefik
    restart: unless-stopped
    command:
      - --api=false
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ai_proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "${TRAEFIK_BIND_IP}:80:80"
      - "${TRAEFIK_BIND_IP}:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/ai-files/traefik/dynamic:/etc/traefik/dynamic:ro
      - /mnt/ai-files/traefik/acme:/etc/traefik/acme
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    container_name: ai-redis
    restart: unless-stopped
    volumes:
      - /mnt/ai-files/redis/data:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - /mnt/ai-files/postgres/data:/var/lib/postgresql/data
      - /mnt/ai-files/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - /mnt/ai-files/ollama/data:/root/.ollama
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: 1h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"

  faster-whisper:
    image: ${FASTER_WHISPER_IMAGE}
    container_name: ai-faster-whisper
    restart: unless-stopped
    environment:
      WHISPER__MODEL: medium
      WHISPER__INFERENCE_DEVICE: cpu
    networks:
      - backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kokoro:
    image: ${KOKORO_IMAGE}
    container_name: ai-kokoro
    restart: unless-stopped
    environment:
      API_LOG_LEVEL: WARNING
    networks:
      - backend
    expose:
      - "8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8880/v1/audio/voices || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  authentik-server:
    image: ${AUTHENTIK_IMAGE}
    container_name: ai-authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
    volumes:
      - /mnt/ai-files/authentik/media:/media
      - /mnt/ai-files/authentik/templates:/templates
    networks:
      - proxy
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/-/health/ready/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=ai_proxy
      - traefik.http.routers.authentik.rule=Host(`${AUTH_FQDN}`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls=true
      - traefik.http.routers.authentik.tls.certresolver=letsencrypt
      - traefik.http.services.authentik.loadbalancer.server.port=9000

  authentik-worker:
    image: ${AUTHENTIK_IMAGE}
    container_name: ai-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
    volumes:
      - /mnt/ai-files/authentik/media:/media
      - /mnt/ai-files/authentik/templates:/templates
      - /mnt/ai-files/authentik/certs:/certs
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    container_name: ai-open-webui
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WEBUI_URL: https://${AI_FQDN}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://${OPENWEBUI_DB_USER}:${OPENWEBUI_DB_PASSWORD}@postgres:5432/${OPENWEBUI_DB_NAME}
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_SCOPES: openid email profile
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ADMIN_ROLES: ai-admins
      OAUTH_ALLOWED_ROLES: ai-admins,ai-users
      UVICORN_WORKERS: "1"
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://faster-whisper:8000/v1
      AUDIO_STT_OPENAI_API_KEY: unused
      AUDIO_STT_MODEL: Systran/faster-whisper-medium
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: unused
      AUDIO_TTS_MODEL: tts-1
      AUDIO_TTS_VOICE: af_bella
    volumes:
      - /mnt/ai-files/open-webui/data:/app/backend/data
      - /mnt/ai-files/open-webui/knowledge:/knowledge:ro
    networks:
      - proxy
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      faster-whisper:
        condition: service_healthy
      kokoro:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=ai_proxy
      - traefik.http.routers.openwebui.rule=Host(`${AI_FQDN}`)
      - traefik.http.routers.openwebui.entrypoints=websecure
      - traefik.http.routers.openwebui.tls=true
      - traefik.http.routers.openwebui.tls.certresolver=letsencrypt
      - traefik.http.services.openwebui.loadbalancer.server.port=8080

  mem0:
    image: ${MEM0_IMAGE}
    container_name: ai-mem0
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: ${MEM0_LLM_MODEL}
      EMBEDDER_PROVIDER: ollama
      EMBEDDER_MODEL: nomic-embed-text
      OLLAMA_BASE_URL: http://ollama:11434
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${MEM0_DB_NAME}
      POSTGRES_USER: ${MEM0_DB_USER}
      POSTGRES_PASSWORD: ${MEM0_DB_PASSWORD}
      POSTGRES_COLLECTION_NAME: memories
      MEM0_TELEMETRY: "false"
    networks:
      - backend
      - database
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  portainer:
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:2.21.5}
    container_name: ai-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/ai-files/portainer/data:/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=ai_proxy
      - traefik.http.routers.portainer.rule=Host(`${PORTAINER_FQDN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.tls.certresolver=letsencrypt
      - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  proxy:
    name: ai_proxy
  backend:
    name: ai_backend
    internal: true
  database:
    name: ai_database
    internal: true
