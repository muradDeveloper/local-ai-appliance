# SearXNG configuration for local AI appliance
# JSON format must be enabled for Open WebUI web search integration.

use_default_settings: true

general:
  instance_title: "Local AI Search"
  debug: false
  private_instance: true

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "ca0da751ba34045f972c4c742003c420830b99fbc324aa629beaf653d57f9054"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

ui:
  default_theme: simple
  results_on_new_tab: false

engines:
  - name: brave
    disabled: true
  - name: brave.images
    disabled: true
  - name: brave.news
    disabled: true
  - name: brave.videos
    disabled: true
  - name: wikidata
    disabled: true

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Tor check plugin
  - Unit converter plugin
  - Open Access DOI rewrite
